name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: |
        pip install flake8 black mypy bandit pytest prometheus-client requests pydantic click numpy pandas
        
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: Run Lint
      run: ./scripts/lint.sh
      
    - name: Run Tests
      run: ./scripts/dev_run_all_tests.sh

  integration-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - uses: actions/checkout@v3
    
    - name: Build and Start Containers
      run: docker-compose -f docker-compose.example.yml up -d --build
      
    - name: Wait for services
      run: sleep 10
      
    - name: Check 1C Exporter
      run: curl -f http://localhost:8000/metrics
      
    - name: Check Bitrix Exporter
      run: curl -f http://localhost:8080/metrics
