[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onec_exporter"
version = "0.1.0"
description = "Prometheus exporter for 1C:Enterprise"
authors = [{name = "Run As Daemon", email = "info@run-as-daemon.ru"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.17.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0"
]

[project.scripts]
onec-exporter = "onec_exporter.main:main"
