[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_assistant"
version = "0.1.0"
description = "AI Assistant for 1C-Bitrix Observability"
authors = [{name = "Run As Daemon", email = "info@run-as-daemon.ru"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
ai-assist = "ai_assistant.cli:cli"
